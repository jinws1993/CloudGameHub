name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'client-android/**'
      - '.github/workflows/android.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'client-android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish to GitHub Release'
        required: false
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # needed for creating releases + uploading assets

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    outputs:
      version_name: ${{ steps.ver.outputs.version_name }}
      version_code: ${{ steps.ver.outputs.version_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bootstrap gradle wrapper
        working-directory: client-android
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('client-android/**/*.gradle*', 'client-android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Extract version info
        id: ver
        working-directory: client-android
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        working-directory: client-android

      - name: Verify APK signature
        working-directory: client-android
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          ls -la "$APK"
          # Use apksigner (bundled with build-tools) to verify
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | tail -1)
          if [ -z "$BUILD_TOOLS" ]; then
            echo "No Android build-tools found; skipping signature verify"
          else
            "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" || echo "WARN: signature verify failed (non-fatal)"
          fi

      - name: Rename for distribution
        working-directory: client-android
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/cloudgamehub-${{ steps.ver.outputs.version_name }}-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: nasgame-release-${{ steps.ver.outputs.version_name }}
          path: client-android/app/build/outputs/apk/release/cloudgamehub-${{ steps.ver.outputs.version_name }}-release.apk
          if-no-files-found: error
          retention-days: 90

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Bootstrap gradle wrapper
        working-directory: client-android
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin
      - name: Run Lint
        run: ./gradlew lintRelease --no-daemon
        working-directory: client-android
      - uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: client-android/app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 5

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: nasgame-release-${{ needs.build.outputs.version_name }}

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
          files: |
            cloudgamehub-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  manual-release:
    name: Manual Release (workflow_dispatch)
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
    timeout-minutes: 5

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: nasgame-release-${{ needs.build.outputs.version_name }}

      - name: Create / Update Release (manual)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version_name }}
          name: CloudGameHub v${{ needs.build.outputs.version_name }}
          generate_release_notes: true
          draft: false
          files: |
            cloudgamehub-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}