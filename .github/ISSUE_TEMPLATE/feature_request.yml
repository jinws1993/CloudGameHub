name: ✨ Feature Request
description: 提议新功能或改进
title: "[Feature]: "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        请描述你想要的功能。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题 / Problem
      description: 这个功能解决什么痛点
      placeholder: |
        我目前碰到...很麻烦。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你想要的解决方案 / Desired solution
      placeholder: |
        我希望可以...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: 涉及平台 / Platform
      options:
        - 后端 (FastAPI / Python)
        - Web UI (Vue 3)
        - Android 客户端
        - Windows 客户端
        - 115 云盘集成
        - 文档
      multi_select: true
    validations:
      required: false

  - type: textarea
    id: mockup
    attributes:
      label: UI 草图 / Mockup
    validations:
      required: false