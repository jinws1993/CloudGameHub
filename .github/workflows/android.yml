name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'client-android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'client-android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # gradle/actions/setup-gradle 不会自动生成 wrapper jar. 我们手动 gradle wrapper.
      - name: Generate Gradle Wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bootstrap gradle wrapper
        working-directory: client-android
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('client-android/**/*.gradle*', 'client-android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: client-android

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nasgame-debug-${{ github.sha }}
          path: client-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Bootstrap gradle wrapper
        working-directory: client-android
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin
      - name: Run Lint
        run: ./gradlew lintDebug --no-daemon
        working-directory: client-android
      - uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: client-android/app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 7
